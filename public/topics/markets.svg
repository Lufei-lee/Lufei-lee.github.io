<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img"><title>Portfolio risk and blockchain</title><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#d9a45d"/><stop offset=".45" stop-color="#5ab8ce"/><stop offset="1" stop-color="#7665ba"/></linearGradient></defs><rect width="1200" height="680" fill="#0b1323"/><g font-family="Arial,sans-serif" fill="#e5edf6"><text x="60" y="65" font-size="29">RISK, RETURN &amp; DIGITAL TRUST</text><text x="60" y="98" font-size="16" fill="#9cabc2">Conceptual diagrams · no market data or return forecast</text><path d="M100 480 V165 M100 480 H580" fill="none" stroke="#9cabc2" stroke-width="2"/><path d="M450 450 Q80 370 510 180" fill="none" stroke="#65c5cf" stroke-width="4"/><text x="120" y="170" font-size="18">Expected return</text><text x="375" y="520" font-size="18">Risk (volatility)</text><text x="360" y="230" font-size="18" fill="#d9b577">Efficient frontier</text><rect x="665" y="260" width="145" height="120" rx="14" fill="#18354c" stroke="#6fa5bc"/><text x="737" y="310" text-anchor="middle" font-size="20">Block 1</text><text x="737" y="345" text-anchor="middle" font-size="15">hash + records</text><path d="M810 320 h25" stroke="#d9b577" stroke-width="3"/><rect x="835" y="260" width="145" height="120" rx="14" fill="#18354c" stroke="#6fa5bc"/><text x="907" y="310" text-anchor="middle" font-size="20">Block 2</text><text x="907" y="345" text-anchor="middle" font-size="15">hash + records</text><path d="M980 320 h25" stroke="#d9b577" stroke-width="3"/><rect x="1005" y="260" width="145" height="120" rx="14" fill="#18354c" stroke="#6fa5bc"/><text x="1077" y="310" text-anchor="middle" font-size="20">Block 3</text><text x="1077" y="345" text-anchor="middle" font-size="15">hash + records</text><text x="900" y="435" text-anchor="middle" font-size="18">Consensus selects a shared history</text><text x="600" y="610" text-anchor="middle" font-size="18" fill="#9cabc2">A portfolio model describes risk; a ledger protocol defines ownership records.</text></g></svg>
